[package]
name = "eider_analyzer"
version = "0.1.2"
eider = "0.1"
main = "lsp_main.ei"
description = "eider-analyzer: a language server (LSP 3.17) for Eider, written in Eider"

# Grants are what each package's code uses, as the compiler reports it (`eiderc caps`) and
# checks when it builds (E0204): json uses nothing, so it is granted nothing.
# A git package: scripts/build.sh takes it from a local checkout when it can
# (EIDER_PKG_OVERRIDE: ../eider-json, else the toolchain's pinned copy .vendor/json).
[deps.json]
git = "https://github.com/klxdev/eider-json.git"
version = "0.1.1"

# The compiler package (the toolchain's compiler/): lexer, parser, checker, diagnostics.
# Only lsp_analysis.ei imports it. target/toolchain is the toolchain scripts/build.sh found
# (it links it), so the compiler, core and std come from one toolchain. No `ffi`: the
# compiler has no unmanaged code of its own (it reaches the OS through core, which the
# toolchain grants).
[deps.eiderc]
path = "target/toolchain/compiler"
uses = ["io", "fs", "net", "clock"]
