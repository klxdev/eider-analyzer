[package]
name = "eider_analyzer"
version = "0.1.0"
eider = "0.1"
main = "lsp_main.ei"
description = "eider-analyzer: a language server (LSP 3.17) for Eider, written in Eider"

# Grants are what each package's code uses, as the compiler reports it (`eiderc caps`) and
# checks when it builds (E0204): json uses nothing, so it is granted nothing.
[deps.json]
path = "../eider-lang/packages/json"

# The compiler package (eider-lang/compiler): lexer, parser, checker, diagnostics. Only
# lsp_analysis.ei imports it. No `ffi`: the compiler has no unmanaged code of its own (it
# reaches the OS through core, which the toolchain grants).
[deps.eiderc]
path = "../eider-lang/compiler"
uses = ["io", "fs", "net", "clock"]
